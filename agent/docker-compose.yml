name: dipagentx

services:
  dipagentx:
    # released image (amd64 + arm64); `docker compose up -d --build` builds it from this directory instead
    image: ghcr.io/achirus-code/dipagentx:latest
    build: .
    container_name: dipagentx
    restart: unless-stopped
    ports:
      # 3470 is the DipAgentX default port – the app uses it automatically
      - "3470:3470"
    env_file:
      - path: .env
        required: false   # without .env the defaults apply (token is generated, paper trading)
    volumes:
      - dipagentx-data:/data
      # optional: Revolut X private key (revx_private.pem) when configured via .env instead of the app
      - ./secrets:/secrets:ro

volumes:
  dipagentx-data:
