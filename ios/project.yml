# XcodeGen spec of the iPhone app – `xcodegen` (in this folder) regenerates DipAgentX.xcodeproj.
# The sources folder is synchronized: new Swift files need no regeneration.
name: DipAgentX
options:
  bundleIdPrefix: de.achirus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  DipAgentXKit:
    path: ../shared/DipAgentXKit
targets:
  DipAgentX:
    type: application
    platform: iOS
    sources:
      - path: DipAgentX
        type: syncedFolder
      - path: ../shared/Localization
        name: Localization
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: DipAgentXKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DipAgentX
        CFBundleShortVersionString: "1.22.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.achirus.DipAgentX.refresh]
        NSLocalNetworkUsageDescription: DipAgentX connects to your DipAgentX agent on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.achirus.DipAgentX.ios
        PRODUCT_NAME: DipAgentX
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
